name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas da mesma branch/PR quando chega um commit novo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      # Offline: o encoder ONNX (models/encoder/, ~128 MB) não é versionado e os testes
      # que dependem dele são pulados. Os de integração também pulam sem a API no ar.
      - name: Rodar testes
        run: python -m pytest
